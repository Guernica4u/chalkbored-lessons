<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson</title>
<style>
  :root { color-scheme: dark; --card: #1c2027; --line: #2c323b; --dim: #9aa3ae; --accent: #6aa7ff; }
  html, body { margin: 0; min-height: 100%; background: #14171c; color: #e6e8eb; font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 14px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #continue { width: 100%; padding: 14px 16px; margin-bottom: 14px; border: 0; border-radius: 10px; background: var(--accent); color: #0b1220; font-weight: 700; font-size: 17px; }
  #continue[hidden] { display: none; }
  .list { display: grid; gap: 10px; }
  .v { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); text-align: left; }
  .v:hover, .v:focus-visible { border-color: var(--accent); background: #222833; outline: none; }
  .v b { font-size: 18px; }
  .v span { color: var(--dim); font-size: 14px; text-align: right; }
  .v.off { opacity: .55; }
  .fix { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .fix input { width: 22px; height: 22px; flex: none; margin: 0; }
  .fix b { display: block; }
  .fix small { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Pick a version</h1>
  <button id="continue" hidden></button>
  <div class="list" id="list"></div>
  <label class="fix">
    <input type="checkbox" id="fix">
    <span><b>Multiplayer fix</b><small>Turn this on if multiplayer isn't working. Your friend should turn it on too.</small></span>
  </label>
</main>
<script>
  const VERSIONS = [
    { id: '1.8', go: '../forgecraft.html', wasm: true, note: 'Best on Chromebooks' },
    { id: '1.12', go: '../forgecraft.1.12.html', wasm: true, note: 'Fast' },
    { id: '26.3', go: '../forgecraft-26.3/index.html', wasm: true, note: 'Newest, big download' },
    { id: '26.2', go: '../forgecraft-26.2/index.html', wasm: true, note: 'Big download' },
    { id: '1.5.2', go: '../forgecraft.1.5.html', wasm: false, note: 'Slow, works on old browsers' }
  ];
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  // the fast versions need WebAssembly GC (Chrome 119+); this is the smallest module that uses it
  let gc = false;
  try { gc = WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 3, 1, 0x5f, 0])); } catch (e) {}

  const open = (v) => { set('cb-forge-last', v.id); location.href = v.go; };
  const list = document.getElementById('list');
  for (const v of VERSIONS) {
    const b = document.createElement('button');
    const off = v.wasm && !gc;
    b.className = 'v' + (off ? ' off' : '');
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = v.id;
    b.querySelector('span').textContent = off ? "Won't run on this browser" : (!gc ? 'Use this one' : v.note);
    b.addEventListener('click', () => open(v));
    list.appendChild(b);
  }
  const last = VERSIONS.find((v) => v.id === get('cb-forge-last'));
  if (last && (gc || !last.wasm)) {
    const c = document.getElementById('continue');
    c.textContent = 'Continue with ' + last.id;
    c.hidden = false;
    c.addEventListener('click', () => open(last));
  }

  // the switch sends shared worlds through backup relays (see net.js)
  const fix = document.getElementById('fix');
  fix.checked = get('cb-backup-relay') === '1';
  fix.addEventListener('change', () => {
    set('cb-backup-relay', fix.checked ? '1' : '0');
    // the versions keep their own saved relay list, which beats the one passed in; clear it so the switch takes effect
    try { for (const k of Object.keys(localStorage)) if (/^_eaglercraft.*\.r$/.test(k)) localStorage.removeItem(k); } catch (e) {}
  });
</script>
</body>
</html>
