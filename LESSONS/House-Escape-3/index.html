<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>House Escape 3</title>
    <style>
        body { overflow: hidden !important; margin: 0; padding: 0; }
        #unity-footer, #unity-warning { display:none !important; }
        #unity-container, #unity-canvas { width: 100% !important; height: 100% !important; position: absolute; top: 0; left: 0; }
        #unity-container { margin: 0; padding: 0; }
    </style>
</head>

<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-logo-title-footer"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">Trees Hate You</div>
        </div>
    </div>
        <script>
        window.fileMergerConfig = {
            files: [
                { name: 'FinalBuild.data', parts: 30 },
               { name: 'FinalBuild.wasm', parts: 2 },
            ],
            basePath: 'Build/',
            debug: true
        };
    </script>
    <script>
        var canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");

            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/FinalBuild.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/FinalBuild.data",
            frameworkUrl: buildUrl + "/FinalBuild.framework.js",
            codeUrl: buildUrl + "/FinalBuild.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Dvloper",
            productName: "Granny 3",
            productVersion: "0.1.0",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                    unityInstance.SetFullscreen(1);
                };

            }).catch((message) => {
                alert(message);
            });
        };

        // the big files are stored in parts (the host's 25 MB limit); join them here, then start the game
        var partsDone = 0, partsTotal = 0;
        function joinParts(name, count, type) {
            partsTotal += count;
            var loads = [];
            for (var i = 1; i <= count; i++) {
                loads.push(fetch(buildUrl + "/" + name + ".part" + i).then(function (r) {
                    if (!r.ok) throw new Error("missing part of " + name);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    partsDone++;
                    document.querySelector("#unity-progress-bar-full").style.width = (50 * partsDone / partsTotal) + "%";
                    return buf;
                }));
            }
            return Promise.all(loads).then(function (bufs) { return URL.createObjectURL(new Blob(bufs, { type: type })); });
        }
        Promise.all([joinParts("FinalBuild.data", 30, "application/octet-stream"), joinParts("FinalBuild.wasm", 2, "application/wasm")])
            .then(function (urls) {
                config.dataUrl = urls[0];
                config.codeUrl = urls[1];
                document.body.appendChild(script);
            }).catch(function (e) { alert(e.message); });
    </script>
</body>

</html>
