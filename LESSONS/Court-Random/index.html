
<!DOCTYPE html>
<html>
  <head>
<title>Court Random</title>
    <script>
      const cancelFrame = window.cancelAnimationFrame.bind(window);
      window.cancelAnimationFrame = function (value) {
        return typeof value === "function"
          ? window.requestAnimationFrame(value)
          : cancelFrame(value);
      };
    </script>

    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
    />
    <script>
      window.addEventListener(
        "keydown",
        function (e) {
          if ([32, 37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
        },
        false,
      );
    </script>
  </head>
